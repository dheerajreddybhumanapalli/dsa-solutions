name: ci
on:
  push:
    paths:
      - 'leetcode/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'leetcode/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed solutions
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(ls leetcode/*/solution.cpp 2>/dev/null | tr '\n' ' ')
          else
            FILES=$(git diff --name-only "$BASE" "${{ github.sha }}" -- 'leetcode/*/solution.cpp' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed solutions: ${FILES:-<none>}"
      - name: Compile changed solutions only
        run: |
          mkdir -p build
          if [ -z "${{ steps.changed.outputs.files }}" ]; then
            echo "No solution.cpp changed — nothing to build."
            exit 0
          fi
          for f in ${{ steps.changed.outputs.files }}; do
            id=$(echo "$f" | cut -d/ -f2 | cut -d- -f1)
            echo "Compiling $f -> build/$id"
            g++ -std=c++17 -Wall -Wextra -O2 "$f" -o "build/$id"
          done
      - name: Smoke-run built binaries
        run: |
          if [ -z "$(ls -A build 2>/dev/null)" ]; then
            echo "Nothing built — skipping."
            exit 0
          fi
          for b in build/*; do echo "== $b"; "$b" || exit 1; done
